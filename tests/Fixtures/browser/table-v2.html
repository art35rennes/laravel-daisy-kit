<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:*">
    <title>Daisy Table v2 harness</title>
    <link rel="stylesheet" href="/resources/css/app.css">
</head>
<body>
    <main>
        <button type="button" id="load">Load rows</button>
        <button type="button" id="upsert">Upsert row</button>
        <button type="button" id="remove">Remove row</button>
        <output id="action-output">No action</output>
        <output id="state-output">Not initialized</output>

        <div
            id="scope-users"
            data-module="table"
            data-daisy-table="1"
            data-table-config='{"contractVersion":2,"mode":"client","persistState":"url","stateKey":"scope-users","rowKey":"id","columns":[{"key":"name","label":"Name","sortable":true,"filterable":true},{"key":"actions","label":"Actions","type":"actions","cell":{"renderer":"actions"}}],"rows":[],"pageSizeOptions":[1,2],"search":true,"searchDebounceMs":0,"minSearchChars":1}'
        >
            <input type="search" data-table-search aria-label="Search">
            <div data-table-column-menu></div>
            <table>
                <colgroup data-table-colgroup></colgroup>
                <thead><tr data-table-head-row></tr></thead>
                <tbody data-table-body></tbody>
            </table>
            <span data-table-info></span>
            <span data-table-page-indicator></span>
            <button type="button" data-table-prev>Previous</button>
            <button type="button" data-table-next>Next</button>
        </div>
    </main>
    <script type="module" src="/tests/Fixtures/browser/table-v2.js"></script>
</body>
</html>

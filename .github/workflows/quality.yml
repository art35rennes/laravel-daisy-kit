name: Quality

on:
  push:
    branches: [dev, main]
    tags: ['v6.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use only the filtered system store, including inside Node-based actions.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt
  npm_config_cafile: /etc/ssl/certs/ca-certificates.crt

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Distrust eMudhra roots and the compromised cross-signing path
        shell: bash
        run: |
          sudo sed -i -E '/^mozilla\/(emSign[^/]*|Comodo_AAA_Services_root)\.crt$/s/^/!/' /etc/ca-certificates.conf
          sudo update-ca-certificates --fresh
          subjects="$(openssl crl2pkcs7 -nocrl -certfile "$SSL_CERT_FILE" | openssl pkcs7 -print_certs -noout)"
          if grep -Eiq 'emSign|eMudhra|AAA Certificate Services' <<< "$subjects"; then
            echo '::error::An excluded certificate authority remains trusted.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
          ini-values: openssl.cafile=/etc/ssl/certs/ca-certificates.crt,curl.cainfo=/etc/ssl/certs/ca-certificates.crt
        env:
          update: 'true'
      - name: Reject unpatched PHP runtimes
        run: |
          php -r 'exit(PHP_VERSION_ID < 80427 || (PHP_VERSION_ID >= 80500 && PHP_VERSION_ID < 80512) ? 1 : 0);'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: composer build:workbench
      - run: composer lint:check
      - run: composer analyse
      - run: composer test:types
      - run: composer test:full
      - run: npm run test:js
      - run: npm run test:vite-host
      - name: Install the public tag in a fresh Vite host
        if: startsWith(github.ref, 'refs/tags/v6.')
        run: npm run test:vite-host
        env:
          DAISY_KIT_PACKAGE_REPOSITORY: https://github.com/art35rennes/laravel-daisy-kit
          DAISY_KIT_PACKAGE_VERSION: ${{ github.ref_name }}
      - run: composer audit --locked --no-interaction
      - run: npm audit
